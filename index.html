                question: "민수가 부당노동행위에 대해 가장 먼저 구제를 신청하여 도움을 받을 수 있는 국가 기관은 어디인가?",
                options: ["헌법재판소", "대법원", "노동위원회", "경찰서"],

                question: "노동자들이 이 세 가지 권리를 통해 궁극적으로 달성하고자 하는 헌법상의 기본권은 무엇인가?",
                options: ["자유권 (국가로부터 간섭받지 않을 권리)", "사회권 (인간다운 생활을 할 권리)", "참정권 (정치에 참여할 권리)", "청구권 (국가에 일정한 행위를 요구할 권리)"],

        // 페이지가 로드될 때 문제를 HTML에 뿌려주는 함수
        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            
            quizData.forEach((quiz, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.id = `q-block-${index}`;
                questionDiv.className = 'p-6 bg-white rounded-lg border border-gray-200 transition-colors duration-300';
                
                // 선택지 생성 로직
                let optionsHtml = '';
                quiz.options.forEach((opt, optIndex) => {
                    optionsHtml += `
                        <label class="flex items-start gap-3 p-3 rounded hover:bg-blue-50 cursor-pointer border border-transparent hover:border-blue-100 transition">
                            <input type="radio" name="q${index}" value="${optIndex}" class="mt-1 w-4 h-4 text-blue-600">
                            <span class="text-gray-700">${optIndex + 1}. ${opt}</span>
                        </label>
                    `;
                });

                questionDiv.innerHTML = `
                    <div class="mb-2 inline-block bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded font-bold">문제 ${index + 1}</div>
                    <div class="bg-gray-50 p-4 rounded text-gray-700 text-sm mb-4 border-l-4 border-blue-400">
                        <strong>[사례]</strong> ${quiz.caseText}
                    </div>
                    <h3 class="text-lg font-bold text-gray-900 mb-4">Q. ${quiz.question}</h3>
                    <div class="space-y-2">
                        ${optionsHtml}
                    </div>
                    <!-- 채점 후 보여질 피드백 영역 (초기엔 숨김) -->
                    <div id="feedback-${index}" class="mt-4 p-4 rounded hidden">
                        <p id="result-text-${index}" class="font-bold mb-1"></p>
                        <p class="text-sm text-gray-600"><strong>해설:</strong> ${quiz.explanation}</p>
                    </div>
                `;
                container.appendChild(questionDiv);
            });
        }

        // 페이지 로드 시 실행
        window.onload = renderQuiz;

        // ⭐ 여기에 1단계에서 복사한 구글 앱스 스크립트 웹 앱 URL을 붙여넣으세요! ⭐
        const GAS_URL = "YOUR_WEB_APP_URL_HERE"; 

        async function submitQuiz() {
            const studentId = document.getElementById('studentId').value.trim();
            const studentName = document.getElementById('studentName').value.trim();
            const errorMsg = document.getElementById('error-msg');
            
            // 1. 유효성 검사 (학번, 이름, 모든 문제 풀었는지)
            if (!studentId || !studentName) {
                errorMsg.innerText = "학번과 이름을 모두 입력해주세요.";
                errorMsg.classList.remove('hidden');
                return;
            }

            let allAnswered = true;
            let score = 0;
            const userAnswers = [];

            for (let i = 0; i < quizData.length; i++) {
                const selected = document.querySelector(`input[name="q${i}"]:checked`);
                if (!selected) {
                    allAnswered = false;
                    break;
                }
                userAnswers.push(parseInt(selected.value));
            }

            if (!allAnswered) {
                errorMsg.innerText = "풀지 않은 문제가 있습니다. 모든 문제에 답해주세요!";
                errorMsg.classList.remove('hidden');
                return;
            }

            errorMsg.classList.add('hidden');
            
            // UI 변경: 버튼 로딩 상태, 입력 비활성화
            document.getElementById('loading').style.display = 'inline-block';
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('studentId').disabled = true;
            document.getElementById('studentName').disabled = true;

            // 2. 채점 및 피드백 노출
            for (let i = 0; i < quizData.length; i++) {
                const qBlock = document.getElementById(`q-block-${i}`);
                const feedbackDiv = document.getElementById(`feedback-${i}`);
                const resultText = document.getElementById(`result-text-${i}`);
                
                // 라디오 버튼 비활성화
                const radios = document.querySelectorAll(`input[name="q${i}"]`);
                radios.forEach(radio => radio.disabled = true);

                if (userAnswers[i] === quizData[i].answer) {
                    // 정답
                    score++;
                    qBlock.classList.add('correct-bg');
                    feedbackDiv.classList.add('bg-green-100');
                    resultText.className = "font-bold mb-1 text-green-700";
                    resultText.innerText = "⭕ 정답입니다!";
                } else {
                    // 오답
                    qBlock.classList.add('wrong-bg');
                    feedbackDiv.classList.add('bg-red-100');
                    resultText.className = "font-bold mb-1 text-red-700";
                    resultText.innerText = `❌ 오답입니다. (정답: ${quizData[i].answer + 1}번)`;
                }
                feedbackDiv.classList.remove('hidden');
            }

            // 결과 화면 표시
            document.getElementById('final-score').innerText = score;
            document.getElementById('result-area').classList.remove('hidden');
            document.getElementById('submitBtn').style.display = 'none';

            // 3. 구글 시트로 데이터 전송 (백엔드 통신)
            if (GAS_URL === "https://script.google.com/macros/s/AKfycbyJb3QzhEZHXZA0qXszFr4VpdylWt4jmwBLeaAnXe2JAX1DnNHYqZRUEfFpNvNgdnuK/exec") {
                // 선생님을 위한 안내창
                alert("[개발자 모드 안내] 현재 웹 앱 URL이 입력되지 않아 구글 시트로 점수가 전송되지 않았습니다. 채점 기능은 정상 작동합니다.");
                return;
            }

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // CORS 우회를 위해 text/plain 사용
                    body: JSON.stringify({
                        studentId: studentId,
                        studentName: studentName,
                        score: score
                    })
                });
                const result = await response.json();
                if(result.result !== 'success') {
                    console.error("전송 실패:", result);
                }
            } catch (error) {
                console.error("구글 시트 전송 중 오류 발생:", error);
            }
        }
    </script>
